	<script>
		let selectedDestination = null;
		$(document).ready(function () {
			'use strict';
			$('#myMaps').wayfinding({
				'maps': [
					{ 'path': 'test/fixtures/library_floor_1.svg', 'id': 'floor1' },
					{ 'path': 'test/fixtures/library_floor_2.svg', 'id': 'floor2' },
					{ 'path': 'test/fixtures/library_floor_3.svg', 'id': 'floor3' },
					{ 'path': 'test/fixtures/library_floor_B.svg', 'id': 'floor0' }
				],
				'path': {
					width: 10,
					color: '#FFFF00',
					radius: 8,
					speed: 8
				},
				'startpoint': function () {
					return 'lcd.1';
				},
				'defaultMap': 'floor1',
				'showLocation': true
			}, function () {
				console.log('callback reached');
			});

			$('#popupExitButton').click(function () {
				$('#myPopup').css('visibility', 'hidden');
				$('.filter').css('height', '0px');
				$('.filter').css('visibility', 'hidden');
				$('#myPopup').css('height', '0px');
				$('#myPopup').css('padding-bottom', '0px');
			});

			$('#endingPointButton').click(function () {
				$('.filter').css('visibility', 'visible');
				$('#myPopup').css('visibility', 'visible');
				$('.filter').css('height', '950px');
				$('#myPopup').css('height', '750px');
				$('#myPopup').css('padding-bottom', '50px');
			});

			// make the floor buttons clickable
			$('#floorButtons button').click(function () {
				// $('.floorButton').addClass('floorButton');
				$('#floorButtons button').removeClass('floorButtonActive').addClass('floorButton');
				$(this).addClass('floorButtonActive');
				$(this).removeClass('floorButton');
				$('#myMaps').wayfinding('currentMap', $(this).prop('id'));
			});

			$('.destination_button').click(function () {
				selectedDestination = $(this).val(); 
				console.log('Saved destination:', selectedDestination); // Optional debug log
				$('#myPopup').css('visibility', 'hidden');
				$('.filter').css('visibility', 'hidden');
				$('#myMaps').wayfinding('routeTo', $(this).val());
			});

			$('#accessibilityOption #accessibleButton').change(function () {
				if ($('#accessibleButton:checked').val() !== undefined) {
					$('#myMaps').wayfinding('accessibleRoute', true);
				} else {
					$('#myMaps').wayfinding('accessibleRoute', false);
				}
				console.log(selectedDestination);
				if (selectedDestination !== null) {
					$('#myMaps').wayfinding('routeTo', selectedDestination);
				}
			});

			$('#myMaps').on('wayfinding:roomClicked', function (e, r) {
				selectedDestination = r.roomId;
				console.log(r.roomId);
				// $('#endSelect option[value="' + r.roomId + '"]').attr('selected', true);
			});

		});
	</script>
